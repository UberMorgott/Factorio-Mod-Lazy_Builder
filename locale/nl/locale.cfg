[mod-name]
auto-build-and-deconstruct=Luie Bouwer

[mod-description]
auto-build-and-deconstruct=Deze mod stelt je in staat om automatisch te bouwen op geestplaatsingen, objecten inclusief tegels te slopen en objecten te upgraden volgens een upgradeplan.

[shortcut]
player-toggle-auto-shortcut=Automatisering aan/uit

[controls]
player-toggle-auto-input=Automatisering aan/uit

[mod-setting-name]
default-radius=Gebruik standaard karakterradius.
custom-radius=Aangepaste radius.
instant-deconstruction=Directe sloop.
instant-construction=Directe constructie.
instant-upgrade=Directe upgrade.
deconstruct-stones-trees=Sta sloop van bomen en stenen toe.
nearest-first=Dichtstbijzijnde eerst bouwen en slopen.

[mod-setting-description]
default-radius=Gebruikt de standaard bouwradius van de speler alsof je handmatig bouwt.
custom-radius=Voer een aangepaste radiuswaarde in voor het verwerken van objecten. Werkt niet als de standaardradius is ingeschakeld.
instant-deconstruction=Alle gemarkeerde objecten binnen de opgegeven radius worden direct gesloopt.
instant-construction=Alle objecten op geestplaatsingen binnen de opgegeven radius worden direct gebouwd, mits beschikbaar in de inventaris.
instant-upgrade=Alle gemarkeerde objecten binnen de opgegeven radius worden direct geüpgraded, mits beschikbaar in de inventaris.
deconstruct-stones-trees=Binnen de opgegeven radius worden naast door spelers gebouwde objecten ook neutrale objecten zoals bomen en stenen gesloopt, maar geen kliffen.
nearest-first=Verwerkt eerst het dichtstbijzijnde object en werkt naar buiten vanaf het karakter. Indien uitgeschakeld worden objecten verwerkt in de interne volgorde van het spel, die willekeurig lijkt. Dit verandert alleen de volgorde, nooit wat er gebouwd of gesloopt wordt.
