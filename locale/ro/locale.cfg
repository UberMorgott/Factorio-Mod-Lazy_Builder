[mod-name]
auto-build-and-deconstruct=Constructor Leneș

[mod-description]
auto-build-and-deconstruct=Acest mod vă permite să construiți automat pe amplasamente fantomă, să demolați obiecte inclusiv plăci și să îmbunătățiți obiecte conform unui plan de îmbunătățire.

[shortcut]
player-toggle-auto-shortcut=Comută automatizarea

[controls]
player-toggle-auto-input=Comută automatizarea

[mod-setting-name]
default-radius=Folosește raza implicită a personajului.
custom-radius=Rază personalizată.
instant-deconstruction=Demolare instantanee.
instant-construction=Construcție instantanee.
instant-upgrade=Îmbunătățire instantanee.
deconstruct-stones-trees=Permite demolarea copacilor și pietrelor.

[mod-setting-description]
default-radius=Folosește raza de construcție implicită a jucătorului ca și cum ai construi manual.
custom-radius=Introduceți o valoare personalizată a razei pentru procesarea obiectelor. Nu funcționează dacă raza implicită este activată.
instant-deconstruction=Toate obiectele marcate din raza specificată sunt demolate instantaneu.
instant-construction=Toate obiectele de pe amplasamentele fantomă din raza specificată sunt construite instantaneu, cu condiția să fie disponibile în inventar.
instant-upgrade=Toate obiectele marcate din raza specificată sunt îmbunătățite instantaneu, cu condiția să fie disponibile în inventar.
deconstruct-stones-trees=În raza specificată, pe lângă obiectele construite de jucători, vor fi demolate și obiecte neutre precum copacii și pietrele, dar nu și stâncile.
