[mod-name]
auto-build-and-deconstruct=Constructeur Paresseux

[mod-description]
auto-build-and-deconstruct=Votre personnage construit les fantômes, déconstruit ce qui est marqué et effectue les améliorations autour de lui - un objet à la fois, avec les objets de votre propre inventaire, sans robots. Activez-le ou désactivez-le avec Ctrl+B ou le bouton de la barre de raccourcis. Le rayon et les modes instantanés se règlent dans les paramètres du mod.

[shortcut]
player-toggle-auto-shortcut=Basculer l'automatisation

[controls]
player-toggle-auto-input=Basculer l'automatisation

[mod-setting-name]
default-radius=Utiliser le rayon par défaut du personnage.
custom-radius=Rayon personnalisé.
instant-deconstruction=Déconstruction instantanée.
instant-construction=Construction instantanée.
instant-upgrade=Amélioration instantanée.
deconstruct-stones-trees=Autoriser la déconstruction des arbres et des pierres.
nearest-first=Construire et déconstruire le plus proche en premier.

[mod-setting-description]
default-radius=Utilise le rayon de construction par défaut du joueur comme si vous construisiez manuellement.
custom-radius=Entrez une valeur de rayon personnalisée pour le traitement des objets. Ne fonctionne pas si le rayon par défaut est activé.
instant-deconstruction=Tous les objets marqués dans le rayon spécifié sont déconstruits instantanément.
instant-construction=Tous les objets sur les emplacements fantômes dans le rayon spécifié sont construits instantanément, à condition qu'ils soient disponibles dans l'inventaire.
instant-upgrade=Tous les objets marqués dans le rayon spécifié sont améliorés instantanément, à condition qu'ils soient disponibles dans l'inventaire.
deconstruct-stones-trees=Dans le rayon spécifié, en plus des objets construits par les joueurs, les objets neutres comme les arbres et les pierres seront également déconstruits, mais pas les falaises.
nearest-first=Traite d'abord l'entité la plus proche et progresse vers l'extérieur depuis le personnage. Lorsque désactivé, les entités sont traitées dans l'ordre interne du jeu, qui semble aléatoire. Cela ne change que l'ordre, jamais ce qui est construit ou supprimé.
