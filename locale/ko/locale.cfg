[mod-name]
auto-build-and-deconstruct=게으른 건설자

[mod-description]
auto-build-and-deconstruct=이 모드는 고스트 위치에 자동으로 건설하고, 타일을 포함한 개체를 해체하며, 업그레이드 계획에 따라 개체를 업그레이드할 수 있게 합니다.

[shortcut]
player-toggle-auto-shortcut=자동화 전환

[controls]
player-toggle-auto-input=자동화 전환

[mod-setting-name]
default-radius=기본 캐릭터 반경 사용.
custom-radius=사용자 지정 반경.
instant-deconstruction=즉시 해체.
instant-construction=즉시 건설.
instant-upgrade=즉시 업그레이드.
deconstruct-stones-trees=나무와 돌 해체 허용.

[mod-setting-description]
default-radius=수동으로 건설하는 것처럼 플레이어의 기본 건설 반경을 사용합니다.
custom-radius=개체 처리를 위한 사용자 지정 반경 값을 입력하세요. 기본 반경이 활성화된 경우 작동하지 않습니다.
instant-deconstruction=지정된 반경 내의 모든 표시된 개체가 즉시 해체됩니다.
instant-construction=지정된 반경 내의 고스트 위치에 있는 모든 개체가 인벤토리에 있는 경우 즉시 건설됩니다.
instant-upgrade=지정된 반경 내의 모든 표시된 개체가 인벤토리에 있는 경우 즉시 업그레이드됩니다.
deconstruct-stones-trees=지정된 반경 내에서 플레이어가 건설한 개체 외에도 나무와 돌과 같은 중립 개체도 해체되지만 절벽은 포함되지 않습니다.
