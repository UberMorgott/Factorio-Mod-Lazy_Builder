[mod-name]
auto-build-and-deconstruct=Leniwy Budowniczy

[mod-description]
auto-build-and-deconstruct=Ten mod pozwala automatycznie budować na miejscach duchów, rozbierać obiekty wraz z kafelkami oraz ulepszać obiekty zgodnie z planem ulepszeń.

[shortcut]
player-toggle-auto-shortcut=Przełącz automatyzację

[controls]
player-toggle-auto-input=Przełącz automatyzację

[mod-setting-name]
default-radius=Użyj domyślnego zasięgu postaci.
custom-radius=Niestandardowy zasięg.
instant-deconstruction=Natychmiastowa rozbiórka.
instant-construction=Natychmiastowa budowa.
instant-upgrade=Natychmiastowe ulepszenie.
deconstruct-stones-trees=Zezwól na rozbiórkę drzew i kamieni.

[mod-setting-description]
default-radius=Używa domyślnego zasięgu budowania gracza, jakbyś budował ręcznie.
custom-radius=Wprowadź niestandardową wartość zasięgu do przetwarzania obiektów. Nie działa, jeśli domyślny zasięg jest włączony.
instant-deconstruction=Wszystkie oznaczone obiekty w określonym zasięgu są natychmiast rozbierane.
instant-construction=Wszystkie obiekty na miejscach duchów w określonym zasięgu są natychmiast budowane, jeśli są dostępne w ekwipunku.
instant-upgrade=Wszystkie oznaczone obiekty w określonym zasięgu są natychmiast ulepszane, jeśli są dostępne w ekwipunku.
deconstruct-stones-trees=W określonym zasięgu, oprócz obiektów zbudowanych przez graczy, będą również rozbierane obiekty neutralne, takie jak drzewa i kamienie, ale nie klify.
