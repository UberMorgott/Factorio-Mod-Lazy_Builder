[mod-name]
auto-build-and-deconstruct=懒人建造者

[mod-description]
auto-build-and-deconstruct=你的角色会自动建造周围的虚影、拆除标记为拆除的物体并执行升级——逐个进行，使用你自己背包里的物品，无需机器人。按 Ctrl+B 或快捷栏按钮开关。范围和即时模式可在模组设置中调整。

[shortcut]
player-toggle-auto-shortcut=切换自动化

[controls]
player-toggle-auto-input=切换自动化

[mod-setting-name]
default-radius=使用默认角色半径。
custom-radius=自定义半径。
instant-deconstruction=即时拆除。
instant-construction=即时建造。
instant-upgrade=即时升级。
deconstruct-stones-trees=允许拆除树木和石头。
nearest-first=优先建造和拆除最近的。

[mod-setting-description]
default-radius=使用玩家的默认建造半径，如同手动建造一样。
custom-radius=输入用于处理物体的自定义半径值。如果启用了默认半径则不起作用。
instant-deconstruction=指定半径内所有标记的物体将立即被拆除。
instant-construction=指定半径内所有幽灵位置上的物体将立即被建造，前提是物品在库存中可用。
instant-upgrade=指定半径内所有标记的物体将立即被升级，前提是物品在库存中可用。
deconstruct-stones-trees=在指定半径内，除了玩家建造的物体外，树木和石头等中性物体也将被拆除，但不包括悬崖。
nearest-first=优先处理离角色最近的实体，并向外扩展。关闭时，实体按游戏内部顺序处理，看起来是随机的。此设置仅改变处理顺序，不影响建造或拆除的内容。
