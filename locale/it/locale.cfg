[mod-name]
auto-build-and-deconstruct=Costruttore Pigro

[mod-description]
auto-build-and-deconstruct=Il tuo personaggio costruisce i fantasmi, smantella ciò che è segnato e applica gli aggiornamenti intorno a sé - uno alla volta e con gli oggetti del tuo inventario, senza robot. Attivalo o disattivalo con Ctrl+B o con il pulsante nella barra delle scorciatoie. Il raggio e le modalità istantanee sono nelle impostazioni della mod.

[shortcut]
player-toggle-auto-shortcut=Attiva/Disattiva automazione

[controls]
player-toggle-auto-input=Attiva/Disattiva automazione

[mod-setting-name]
default-radius=Usa il raggio predefinito del personaggio.
custom-radius=Raggio personalizzato.
instant-deconstruction=Decostruzione istantanea.
instant-construction=Costruzione istantanea.
instant-upgrade=Aggiornamento istantaneo.
deconstruct-stones-trees=Permetti la decostruzione di alberi e pietre.
nearest-first=Costruisci e deconstruisci prima il più vicino.

[mod-setting-description]
default-radius=Utilizza il raggio di costruzione predefinito del giocatore come se stessi costruendo manualmente.
custom-radius=Inserisci un valore di raggio personalizzato per l'elaborazione degli oggetti. Non funziona se il raggio predefinito è abilitato.
instant-deconstruction=Tutti gli oggetti contrassegnati entro il raggio specificato vengono decostruiti istantaneamente.
instant-construction=Tutti gli oggetti sui posizionamenti fantasma entro il raggio specificato vengono costruiti istantaneamente, a condizione che siano disponibili nell'inventario.
instant-upgrade=Tutti gli oggetti contrassegnati entro il raggio specificato vengono aggiornati istantaneamente, a condizione che siano disponibili nell'inventario.
deconstruct-stones-trees=Nel raggio specificato, oltre agli oggetti costruiti dai giocatori, verranno decostruiti anche oggetti neutrali come alberi e pietre, ma non le scogliere.
nearest-first=Gestisce prima l'entità più vicina e procede verso l'esterno dal personaggio. Se disattivato, le entità vengono gestite nell'ordine interno del gioco, che appare casuale. Questo cambia solo l'ordine, mai ciò che viene costruito o rimosso.
