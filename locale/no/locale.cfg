[mod-name]
auto-build-and-deconstruct=Lat Bygger

[mod-description]
auto-build-and-deconstruct=Karakteren din bygger spøkelser, river det som er merket for riving og utfører oppgraderinger rundt seg - én om gangen og med gjenstander fra ditt eget inventar, uten roboter. Slå av og på med Ctrl+B eller knappen i snarveilinjen. Radius og umiddelbare moduser finner du i modinnstillingene.

[shortcut]
player-toggle-auto-shortcut=Veksle automatisering

[controls]
player-toggle-auto-input=Veksle automatisering

[mod-setting-name]
default-radius=Bruk standard karakterradius.
custom-radius=Egendefinert radius.
instant-deconstruction=Umiddelbar riving.
instant-construction=Umiddelbar konstruksjon.
instant-upgrade=Umiddelbar oppgradering.
deconstruct-stones-trees=Tillat riving av trær og steiner.
nearest-first=Bygg og riv nærmeste først.

[mod-setting-description]
default-radius=Bruker spillerens standard byggeradius som om du bygget manuelt.
custom-radius=Skriv inn en egendefinert radiusverdi for behandling av objekter. Fungerer ikke hvis standardradius er aktivert.
instant-deconstruction=Alle merkede objekter innenfor den angitte radiusen rives umiddelbart.
instant-construction=Alle objekter på spøkelsesplasseringer innenfor den angitte radiusen bygges umiddelbart, forutsatt at de er tilgjengelige i inventaret.
instant-upgrade=Alle merkede objekter innenfor den angitte radiusen oppgraderes umiddelbart, forutsatt at de er tilgjengelige i inventaret.
deconstruct-stones-trees=Innenfor den angitte radiusen vil, i tillegg til spillerbygde objekter, også nøytrale objekter som trær og steiner bli revet, men ikke klipper.
nearest-first=Behandler det nærmeste objektet først og arbeider utover fra karakteren. Når av, behandles objekter i spillets interne rekkefølge, som ser tilfeldig ut. Dette endrer kun rekkefølgen, aldri hva som bygges eller rives.
