[mod-name]
auto-build-and-deconstruct=Constructor Perezoso

[mod-description]
auto-build-and-deconstruct=Este mod te permite construir automáticamente en ubicaciones fantasma, deconstruir objetos incluyendo baldosas, y mejorar objetos según un plan de mejora.

[shortcut]
player-toggle-auto-shortcut=Alternar automatización

[controls]
player-toggle-auto-input=Alternar automatización

[mod-setting-name]
default-radius=Usar radio predeterminado del personaje.
custom-radius=Radio personalizado.
instant-deconstruction=Deconstrucción instantánea.
instant-construction=Construcción instantánea.
instant-upgrade=Mejora instantánea.
deconstruct-stones-trees=Permitir deconstrucción de árboles y piedras.

[mod-setting-description]
default-radius=Usa el radio de construcción predeterminado del jugador como si estuvieras construyendo manualmente.
custom-radius=Ingresa un valor de radio personalizado para procesar objetos. No funciona si el radio predeterminado está activado.
instant-deconstruction=Todos los objetos marcados dentro del radio especificado se deconstruyen instantáneamente.
instant-construction=Todos los objetos en ubicaciones fantasma dentro del radio especificado se construyen instantáneamente, siempre que estén disponibles en el inventario.
instant-upgrade=Todos los objetos marcados dentro del radio especificado se mejoran instantáneamente, siempre que estén disponibles en el inventario.
deconstruct-stones-trees=En el radio especificado, además de los objetos construidos por jugadores, también se deconstruirán objetos neutrales como árboles y piedras, pero no acantilados.
