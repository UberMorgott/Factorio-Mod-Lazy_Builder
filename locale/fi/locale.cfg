[mod-name]
auto-build-and-deconstruct=Laiska Rakentaja

[mod-description]
auto-build-and-deconstruct=Tämä modi mahdollistaa automaattisen rakentamisen haamusijoituksiin, kohteiden purkamisen laatat mukaan lukien ja kohteiden päivittämisen päivityssuunnitelman mukaisesti.

[shortcut]
player-toggle-auto-shortcut=Vaihda automaatio

[controls]
player-toggle-auto-input=Vaihda automaatio

[mod-setting-name]
default-radius=Käytä oletushahmon sädettä.
custom-radius=Mukautettu säde.
instant-deconstruction=Välitön purku.
instant-construction=Välitön rakentaminen.
instant-upgrade=Välitön päivitys.
deconstruct-stones-trees=Salli puiden ja kivien purku.
nearest-first=Rakenna ja pura lähimmät ensin.

[mod-setting-description]
default-radius=Käyttää pelaajan oletusrakennussädettä kuin rakentaisit manuaalisesti.
custom-radius=Syötä mukautettu säteen arvo kohteiden käsittelyyn. Ei toimi, jos oletussäde on käytössä.
instant-deconstruction=Kaikki merkityt kohteet määritetyn säteen sisällä puretaan välittömästi.
instant-construction=Kaikki haamusijoitusten kohteet määritetyn säteen sisällä rakennetaan välittömästi, mikäli ne ovat saatavilla inventaariossa.
instant-upgrade=Kaikki merkityt kohteet määritetyn säteen sisällä päivitetään välittömästi, mikäli ne ovat saatavilla inventaariossa.
deconstruct-stones-trees=Määritetyn säteen sisällä pelaajien rakentamien kohteiden lisäksi myös neutraalit kohteet kuten puut ja kivet puretaan, mutta ei kallioita.
nearest-first=Käsittelee lähimmän kohteen ensin ja etenee hahmosta ulospäin. Pois päältä ollessa kohteet käsitellään pelin sisäisessä järjestyksessä, joka vaikuttaa satunnaiselta. Tämä muuttaa vain järjestystä, ei koskaan sitä mitä rakennetaan tai puretaan.
