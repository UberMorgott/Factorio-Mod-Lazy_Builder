[mod-name]
auto-build-and-deconstruct=Lazy Builder

[mod-description]
auto-build-and-deconstruct=Builds ghosts, removes things marked for deconstruction and applies upgrades around your character, one at a time and using items from your own inventory - no robots needed. Toggle it with Ctrl+B or the shortcut bar button. Radius and instant modes are in Mod settings.

[shortcut]
player-toggle-auto-shortcut=Toggle Automation

[controls]
player-toggle-auto-input=Toggle Automation

[mod-setting-name]
default-radius=Use default character radius.
custom-radius=Custom radius.
instant-deconstruction=Instant deconstruction.
instant-construction=Instant construction.
instant-upgrade=Instant upgrade.
deconstruct-stones-trees=Allow deconstruction of trees and stones.
nearest-first=Build and deconstruct nearest first.

[mod-setting-description]
default-radius=Uses the player's default building radius as if you were building manually.
custom-radius=Enter a custom radius value for processing objects. Does not work if the default radius is enabled.
instant-deconstruction=All marked objects within the specified radius are deconstructed instantly.
instant-construction=All objects on ghost placements within the specified radius are constructed instantly, provided they are available in the inventory.
instant-upgrade=All marked objects within the specified radius are upgraded instantly, provided they are available in the inventory.
deconstruct-stones-trees=In the specified radius, in addition to player-built objects, neutral objects such as trees and stones will also be deconstructed, but not cliffs.
nearest-first=Handle the closest entity first and work outward from the character. When off, entities are handled in the game's internal order, which looks random. This only changes the order, never what gets built or removed.