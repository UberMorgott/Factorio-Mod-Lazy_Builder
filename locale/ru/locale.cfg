[mod-name]
auto-build-and-deconstruct=Ленивый строитель

[mod-description]
auto-build-and-deconstruct=Этот мод позволяет вам в автоматическом режиме строить по призракам, сносить объекты включая плитки и улучшать объекты по плану улучшения. 

[shortcut]
player-toggle-auto-shortcut=Вкл\Выкл автоматизацию

[controls]
player-toggle-auto-input=Вкл\Выкл автоматизацию

[mod-setting-name]
default-radius=Использовать радиус персонажа по умолчанию.
custom-radius=Пользовательский радиус.
instant-deconstruction=Мгновенный снос.
instant-construction=Мгновенная постройка.
instant-upgrade=Мгновенное улучшение.
deconstruct-stones-trees=Разрешить снос деревьев и камней.
nearest-first=Строить и сносить сначала ближайшее.

[mod-setting-description]
default-radius=Использует радиус строительства игрока по умолчанию, как если бы вы строили самостоятельно.
custom-radius=Введите пользовательское значение радиуса для обработки объектов. Не работает, если включён радиус по умолчанию.
instant-deconstruction=В заданном радиусе мгновенно демонтируются все отмеченные объекты.
instant-construction=В заданном радиусе мгновенно строятся на призраках все объекты, если они есть в наличии в инвентаре.
instant-upgrade=В заданном радиусе мгновенно улучшаются все отмеченные объекты, если они есть в наличии в инвентаре.
deconstruct-stones-trees=В заданном радиусе помимо объектов, построенных игроками, также будут сноситься и нейтральные объекты, такие как деревья и камни, но не скалы.
nearest-first=Сначала обрабатывает ближайший объект и продвигается от персонажа наружу. При отключении объекты обрабатываются во внутреннем порядке игры, который выглядит случайным. Это изменяет только порядок, но не то, что строится или сносится.