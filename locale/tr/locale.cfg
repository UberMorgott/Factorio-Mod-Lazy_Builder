[mod-name]
auto-build-and-deconstruct=Tembel İnşaatçı

[mod-description]
auto-build-and-deconstruct=Karakterin çevresindeki hayaletleri kendisi inşa eder, yıkım için işaretlenenleri söker ve yükseltmeleri uygular - birer birer ve kendi envanterindeki eşyalarla, robot gerekmeden. Ctrl+B veya kısayol çubuğundaki düğmeyle açıp kapatabilirsin. Yarıçap ve anında modlar mod ayarlarındadır.

[shortcut]
player-toggle-auto-shortcut=Otomasyonu Aç/Kapat

[controls]
player-toggle-auto-input=Otomasyonu Aç/Kapat

[mod-setting-name]
default-radius=Varsayılan karakter yarıçapını kullan.
custom-radius=Özel yarıçap.
instant-deconstruction=Anında yıkım.
instant-construction=Anında inşaat.
instant-upgrade=Anında yükseltme.
deconstruct-stones-trees=Ağaçların ve taşların yıkımına izin ver.
nearest-first=En yakını önce inşa et ve yık.

[mod-setting-description]
default-radius=Manuel olarak inşa ediyormuş gibi oyuncunun varsayılan inşaat yarıçapını kullanır.
custom-radius=Nesneleri işlemek için özel bir yarıçap değeri girin. Varsayılan yarıçap etkinse çalışmaz.
instant-deconstruction=Belirtilen yarıçap içindeki tüm işaretli nesneler anında yıkılır.
instant-construction=Belirtilen yarıçap içindeki hayalet yerleşimlerdeki tüm nesneler, envanterde mevcut olmaları koşuluyla anında inşa edilir.
instant-upgrade=Belirtilen yarıçap içindeki tüm işaretli nesneler, envanterde mevcut olmaları koşuluyla anında yükseltilir.
deconstruct-stones-trees=Belirtilen yarıçap içinde, oyuncuların inşa ettiği nesnelere ek olarak ağaçlar ve taşlar gibi nötr nesneler de yıkılacak, ancak uçurumlar yıkılmayacaktır.
nearest-first=Önce en yakın nesneyi işler ve karakterden dışa doğru ilerler. Kapalıyken nesneler oyunun iç sırasına göre işlenir ve bu rastgele görünür. Bu yalnızca sırayı değiştirir, neyin inşa edildiğini veya kaldırıldığını asla değiştirmez.
