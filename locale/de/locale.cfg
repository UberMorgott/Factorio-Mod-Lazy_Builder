[mod-name]
auto-build-and-deconstruct=Fauler Baumeister

[mod-description]
auto-build-and-deconstruct=Dein Charakter baut Geister, reißt zum Abriss markierte Objekte ab und führt Upgrades in seiner Nähe aus - eins nach dem anderen und mit Gegenständen aus deinem eigenen Inventar, ganz ohne Roboter. Ein- und ausschalten mit Strg+B oder der Schaltfläche in der Schnellzugriffsleiste. Radius und Sofort-Modi findest du in den Mod-Einstellungen.

[shortcut]
player-toggle-auto-shortcut=Automatisierung umschalten

[controls]
player-toggle-auto-input=Automatisierung umschalten

[mod-setting-name]
default-radius=Standard-Charakterradius verwenden.
custom-radius=Benutzerdefinierter Radius.
instant-deconstruction=Sofortiger Abriss.
instant-construction=Sofortige Konstruktion.
instant-upgrade=Sofortiges Upgrade.
deconstruct-stones-trees=Abriss von Bäumen und Steinen erlauben.
nearest-first=Nächstgelegene zuerst bauen und abreißen.

[mod-setting-description]
default-radius=Verwendet den Standard-Bauradius des Spielers, als würden Sie manuell bauen.
custom-radius=Geben Sie einen benutzerdefinierten Radiuswert für die Verarbeitung von Objekten ein. Funktioniert nicht, wenn der Standardradius aktiviert ist.
instant-deconstruction=Alle markierten Objekte innerhalb des angegebenen Radius werden sofort abgerissen.
instant-construction=Alle Objekte auf Geisterplatzierungen innerhalb des angegebenen Radius werden sofort gebaut, sofern sie im Inventar verfügbar sind.
instant-upgrade=Alle markierten Objekte innerhalb des angegebenen Radius werden sofort verbessert, sofern sie im Inventar verfügbar sind.
deconstruct-stones-trees=Im angegebenen Radius werden neben spielergebauten Objekten auch neutrale Objekte wie Bäume und Steine abgerissen, jedoch keine Klippen.
nearest-first=Bearbeitet zuerst das nächstgelegene Objekt und arbeitet sich vom Charakter nach außen vor. Bei Deaktivierung werden Objekte in der internen Reihenfolge des Spiels verarbeitet, die zufällig wirkt. Dies ändert nur die Reihenfolge, niemals was gebaut oder abgerissen wird.
