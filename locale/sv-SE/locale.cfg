[mod-name]
auto-build-and-deconstruct=Lat Byggare

[mod-description]
auto-build-and-deconstruct=Din karaktär bygger spöken, river det som är markerat för rivning och utför uppgraderingar runt sig - en i taget och med föremål från ditt eget förråd, utan robotar. Slå på och av med Ctrl+B eller knappen i genvägsfältet. Radie och omedelbara lägen finns i modinställningarna.

[shortcut]
player-toggle-auto-shortcut=Växla automatisering

[controls]
player-toggle-auto-input=Växla automatisering

[mod-setting-name]
default-radius=Använd standardkaraktärsradie.
custom-radius=Anpassad radie.
instant-deconstruction=Omedelbar rivning.
instant-construction=Omedelbar konstruktion.
instant-upgrade=Omedelbar uppgradering.
deconstruct-stones-trees=Tillåt rivning av träd och stenar.
nearest-first=Bygg och riv närmaste först.

[mod-setting-description]
default-radius=Använder spelarens standardbyggradie som om du byggde manuellt.
custom-radius=Ange ett anpassat radievärde för bearbetning av objekt. Fungerar inte om standardradien är aktiverad.
instant-deconstruction=Alla markerade objekt inom den angivna radien rivs omedelbart.
instant-construction=Alla objekt på spökplaceringar inom den angivna radien byggs omedelbart, förutsatt att de finns i inventariet.
instant-upgrade=Alla markerade objekt inom den angivna radien uppgraderas omedelbart, förutsatt att de finns i inventariet.
deconstruct-stones-trees=Inom den angivna radien rivs, förutom spelarbyggda objekt, även neutrala objekt som träd och stenar, men inte klippor.
nearest-first=Hanterar det närmaste objektet först och arbetar utåt från karaktären. När av hanteras objekt i spelets interna ordning, som ser slumpmässig ut. Detta ändrar bara ordningen, aldrig vad som byggs eller rivs.
