[mod-name]
auto-build-and-deconstruct=Líný Stavitel

[mod-description]
auto-build-and-deconstruct=Vaše postava sama staví duchy, bourá objekty označené k demolici a provádí vylepšení kolem sebe - jeden objekt po druhém a z předmětů ve vašem inventáři, bez robotů. Zapíná a vypíná se klávesami Ctrl+B nebo tlačítkem na liště zkratek. Poloměr a okamžité režimy najdete v nastavení modu.

[shortcut]
player-toggle-auto-shortcut=Přepnout automatizaci

[controls]
player-toggle-auto-input=Přepnout automatizaci

[mod-setting-name]
default-radius=Použít výchozí poloměr postavy.
custom-radius=Vlastní poloměr.
instant-deconstruction=Okamžitá demolice.
instant-construction=Okamžitá stavba.
instant-upgrade=Okamžité vylepšení.
deconstruct-stones-trees=Povolit demolici stromů a kamenů.
nearest-first=Stavět a bourat nejbližší jako první.

[mod-setting-description]
default-radius=Používá výchozí poloměr stavby hráče, jako byste stavěli ručně.
custom-radius=Zadejte vlastní hodnotu poloměru pro zpracování objektů. Nefunguje, pokud je povolen výchozí poloměr.
instant-deconstruction=Všechny označené objekty v zadaném poloměru jsou okamžitě zbourány.
instant-construction=Všechny objekty na místech duchů v zadaném poloměru jsou okamžitě postaveny, pokud jsou k dispozici v inventáři.
instant-upgrade=Všechny označené objekty v zadaném poloměru jsou okamžitě vylepšeny, pokud jsou k dispozici v inventáři.
deconstruct-stones-trees=V zadaném poloměru budou kromě objektů postavených hráči zbourány i neutrální objekty jako stromy a kameny, ale ne útesy.
nearest-first=Nejprve zpracuje nejbližší objekt a postupuje směrem od postavy. Při vypnutí jsou objekty zpracovávány ve vnitřním pořadí hry, které vypadá náhodně. Toto mění pouze pořadí, nikdy ne to, co se postaví nebo zbourá.
