[mod-name]
auto-build-and-deconstruct=Ледачий Будівельник

[mod-description]
auto-build-and-deconstruct=Ваш персонаж сам будує привиди, зносить позначене на знесення та виконує покращення навколо себе - по одному об'єкту й з предметів вашого інвентаря, без роботів. Вмикається й вимикається клавішами Ctrl+B або кнопкою на панелі швидкого доступу. Радіус і миттєві режими - в налаштуваннях мода.

[shortcut]
player-toggle-auto-shortcut=Увімк/Вимк автоматизацію

[controls]
player-toggle-auto-input=Увімк/Вимк автоматизацію

[mod-setting-name]
default-radius=Використовувати радіус персонажа за замовчуванням.
custom-radius=Користувацький радіус.
instant-deconstruction=Миттєвий знос.
instant-construction=Миттєва побудова.
instant-upgrade=Миттєве покращення.
deconstruct-stones-trees=Дозволити знос дерев і каменів.
nearest-first=Будувати і зносити найближче першим.

[mod-setting-description]
default-radius=Використовує радіус будівництва гравця за замовчуванням, як якби ви будували самостійно.
custom-radius=Введіть користувацьке значення радіуса для обробки об'єктів. Не працює, якщо увімкнено радіус за замовчуванням.
instant-deconstruction=У заданому радіусі миттєво демонтуються всі позначені об'єкти.
instant-construction=У заданому радіусі миттєво будуються на привидах всі об'єкти, якщо вони є в наявності в інвентарі.
instant-upgrade=У заданому радіусі миттєво покращуються всі позначені об'єкти, якщо вони є в наявності в інвентарі.
deconstruct-stones-trees=У заданому радіусі окрім об'єктів, побудованих гравцями, також будуть зноситися і нейтральні об'єкти, такі як дерева і камені, але не скелі.
nearest-first=Спочатку обробляє найближчий об'єкт і просувається від персонажа назовні. При вимкненні об'єкти обробляються у внутрішньому порядку гри, який виглядає випадковим. Це змінює лише порядок, але не те, що будується чи зноситься.
