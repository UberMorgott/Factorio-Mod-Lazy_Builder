[mod-name]
auto-build-and-deconstruct=レイジービルダー

[mod-description]
auto-build-and-deconstruct=このMODは、ゴースト配置での自動建設、タイルを含むオブジェクトの解体、アップグレード計画に従ったオブジェクトのアップグレードを可能にします。

[shortcut]
player-toggle-auto-shortcut=自動化の切り替え

[controls]
player-toggle-auto-input=自動化の切り替え

[mod-setting-name]
default-radius=デフォルトのキャラクター半径を使用。
custom-radius=カスタム半径。
instant-deconstruction=即時解体。
instant-construction=即時建設。
instant-upgrade=即時アップグレード。
deconstruct-stones-trees=木と石の解体を許可。

[mod-setting-description]
default-radius=手動で建設する場合と同様に、プレイヤーのデフォルト建設半径を使用します。
custom-radius=オブジェクト処理用のカスタム半径値を入力してください。デフォルト半径が有効な場合は機能しません。
instant-deconstruction=指定された半径内のすべてのマークされたオブジェクトが即座に解体されます。
instant-construction=指定された半径内のゴースト配置上のすべてのオブジェクトが、インベントリにある場合即座に建設されます。
instant-upgrade=指定された半径内のすべてのマークされたオブジェクトが、インベントリにある場合即座にアップグレードされます。
deconstruct-stones-trees=指定された半径内では、プレイヤーが建設したオブジェクトに加えて、木や石などの中立オブジェクトも解体されますが、崖は含まれません。
