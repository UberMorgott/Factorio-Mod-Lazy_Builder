[mod-name]
auto-build-and-deconstruct=Construtor Preguiçoso

[mod-description]
auto-build-and-deconstruct=Este mod permite que você construa automaticamente em posições fantasma, desconstrua objetos incluindo pisos, e melhore objetos de acordo com um plano de melhoria.

[shortcut]
player-toggle-auto-shortcut=Alternar automação

[controls]
player-toggle-auto-input=Alternar automação

[mod-setting-name]
default-radius=Usar raio padrão do personagem.
custom-radius=Raio personalizado.
instant-deconstruction=Desconstrução instantânea.
instant-construction=Construção instantânea.
instant-upgrade=Melhoria instantânea.
deconstruct-stones-trees=Permitir desconstrução de árvores e pedras.

[mod-setting-description]
default-radius=Usa o raio de construção padrão do jogador como se você estivesse construindo manualmente.
custom-radius=Insira um valor de raio personalizado para processar objetos. Não funciona se o raio padrão estiver ativado.
instant-deconstruction=Todos os objetos marcados dentro do raio especificado são desconstruídos instantaneamente.
instant-construction=Todos os objetos em posições fantasma dentro do raio especificado são construídos instantaneamente, desde que estejam disponíveis no inventário.
instant-upgrade=Todos os objetos marcados dentro do raio especificado são melhorados instantaneamente, desde que estejam disponíveis no inventário.
deconstruct-stones-trees=No raio especificado, além de objetos construídos por jogadores, objetos neutros como árvores e pedras também serão desconstruídos, mas não penhascos.
