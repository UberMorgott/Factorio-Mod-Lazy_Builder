[mod-name]
auto-build-and-deconstruct=Lusta Építő

[mod-description]
auto-build-and-deconstruct=A karaktered magától megépíti a szellemeket, lebontja a bontásra jelölt dolgokat és elvégzi a fejlesztéseket maga körül - egyenként, a saját leltáradban lévő tárgyakból, robotok nélkül. Be- és kikapcsolás: Ctrl+B vagy a gyorsgomb-sáv gombja. A sugár és az azonnali módok a mod beállításaiban találhatók.

[shortcut]
player-toggle-auto-shortcut=Automatizálás váltása

[controls]
player-toggle-auto-input=Automatizálás váltása

[mod-setting-name]
default-radius=Alapértelmezett karaktersugár használata.
custom-radius=Egyéni sugár.
instant-deconstruction=Azonnali lebontás.
instant-construction=Azonnali építés.
instant-upgrade=Azonnali fejlesztés.
deconstruct-stones-trees=Fák és kövek lebontásának engedélyezése.
nearest-first=Legközelebbi építése és lebontása először.

[mod-setting-description]
default-radius=A játékos alapértelmezett építési sugarát használja, mintha kézzel építenél.
custom-radius=Adj meg egyéni sugárértéket az objektumok feldolgozásához. Nem működik, ha az alapértelmezett sugár engedélyezve van.
instant-deconstruction=A megadott sugáron belül minden megjelölt objektum azonnal lebontásra kerül.
instant-construction=A megadott sugáron belül minden szellemhelyen lévő objektum azonnal megépül, amennyiben elérhető a leltárban.
instant-upgrade=A megadott sugáron belül minden megjelölt objektum azonnal fejlesztésre kerül, amennyiben elérhető a leltárban.
deconstruct-stones-trees=A megadott sugáron belül a játékosok által épített objektumokon kívül a semleges objektumok, például fák és kövek is lebontásra kerülnek, de a sziklák nem.
nearest-first=Először a legközelebbi objektumot kezeli, és a karaktertől kifelé halad. Kikapcsolt állapotban az objektumok a játék belső sorrendjében kerülnek kezelésre, ami véletlenszerűnek tűnik. Ez csak a sorrendet változtatja meg, soha nem azt, hogy mi épül vagy mit bontanak le.
