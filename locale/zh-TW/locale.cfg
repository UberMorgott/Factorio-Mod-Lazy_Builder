[mod-name]
auto-build-and-deconstruct=懶人建造者

[mod-description]
auto-build-and-deconstruct=此模組允許您自動在幽靈位置上建造、拆除包括地磚在內的物體，以及按照升級計劃升級物體。

[shortcut]
player-toggle-auto-shortcut=切換自動化

[controls]
player-toggle-auto-input=切換自動化

[mod-setting-name]
default-radius=使用預設角色半徑。
custom-radius=自訂半徑。
instant-deconstruction=即時拆除。
instant-construction=即時建造。
instant-upgrade=即時升級。
deconstruct-stones-trees=允許拆除樹木和石頭。
nearest-first=優先建造和拆除最近的。

[mod-setting-description]
default-radius=使用玩家的預設建造半徑，如同手動建造一樣。
custom-radius=輸入用於處理物體的自訂半徑值。如果啟用了預設半徑則不起作用。
instant-deconstruction=指定半徑內所有標記的物體將立即被拆除。
instant-construction=指定半徑內所有幽靈位置上的物體將立即被建造，前提是物品在庫存中可用。
instant-upgrade=指定半徑內所有標記的物體將立即被升級，前提是物品在庫存中可用。
deconstruct-stones-trees=在指定半徑內，除了玩家建造的物體外，樹木和石頭等中性物體也將被拆除，但不包括懸崖。
nearest-first=優先處理離角色最近的實體，並向外擴展。關閉時，實體按遊戲內部順序處理，看起來是隨機的。此設定僅改變處理順序，不影響建造或拆除的內容。
